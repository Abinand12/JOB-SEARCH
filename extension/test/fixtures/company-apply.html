<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Apply – Backend Engineer – Acme</title>
<style>
  body { font: 15px system-ui; max-width: 700px; margin: 24px auto; }
  form > * { display: block; margin: 6px 0; }
  .application-question { list-style: none; }
</style>
</head>
<body>
  <h1>Backend Engineer</h1>
  <p>Acme Corp · Remote</p>
  <!-- A fake hCaptcha widget: the detector keys on the iframe src, like the real one. -->
  <div id="captcha"><iframe src="/fake/hcaptcha.com/checkbox?frame=checkbox" width="300" height="80" title="hCaptcha checkbox"></iframe></div>

  <form id="application">
    <label for="first_name">First Name *</label><input id="first_name" name="first_name" required>
    <label for="last_name">Last Name *</label><input id="last_name" name="last_name" required>
    <label for="email">Email *</label><input id="email" name="email" type="email" required>
    <label for="phone">Phone</label><input id="phone" name="phone" type="tel">
    <div class="field">
      <label>Resume/CV *</label>
      <input type="file" id="resume" name="resume" required style="opacity:0;position:absolute;width:1px;height:1px">
      <button type="button">Attach</button>
    </div>
    <label for="linkedin">LinkedIn Profile</label><input id="linkedin" name="linkedin">
    <ul>
      <li class="application-question">
        <div class="application-label">How many years of experience do you have with Python?</div>
        <div class="application-field"><input name="cards[python]" required></div>
      </li>
    </ul>
    <fieldset>
      <legend>Will you now or in the future require visa sponsorship? *</legend>
      <label><input type="radio" name="sponsor" value="yes" required> Yes</label>
      <label><input type="radio" name="sponsor" value="no"> No</label>
    </fieldset>
    <label for="gender">Gender</label>
    <select id="gender" name="gender"><option value="">Select...</option><option>Male</option><option>Female</option><option>Decline to self-identify</option></select>
    <label for="why">Why do you want to work at Acme? *</label><textarea id="why" name="why" required></textarea>
    <label for="exp">Describe a backend system you built</label><textarea id="exp" name="exp"></textarea>
    <label><input type="checkbox" id="consent" name="consent" required> I agree to the privacy policy *</label>
    <label><input type="checkbox" id="sms" name="sms"> Send me job alerts by text message</label>
    <button type="submit">Submit application</button>
  </form>

  <script>
    document.getElementById('application').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = new FormData(e.target);
      const data = {};
      for (const [k, v] of form.entries()) data[k] = v instanceof File ? `file:${v.name}:${v.size}` : v;
      data.consent = document.getElementById('consent').checked;
      data.sms = document.getElementById('sms').checked;
      await fetch('/submitted', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(data) });
      document.body.innerHTML = '<h1>Thank you for applying!</h1><p>We have received your application.</p>';
    });
  </script>
</body>
</html>
